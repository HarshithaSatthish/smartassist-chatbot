services:
  - type: web
    name: smartassist-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: AI_MODEL
        value: llama-3.1-8b-instant
      - key: AI_TIMEOUT
        value: "30"
      - key: CORS_ORIGINS
        sync: false
      - key: SECRET_KEY
        sync: false
